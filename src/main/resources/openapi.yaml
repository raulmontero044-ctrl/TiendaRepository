openapi: 3.0.1
info:
  title: Tienda API
  description: API de tienda
  version: '1.0.0'
tags:
  - name: Catalogos
  - name: Productos
paths:
  /api/catalogos:
    get:
      tags:
        - Catalogos
      operationId: getCatalogo
      summary: Obtener catálogo completo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /api/catalogos/{idCatalogo}:
    get:
      tags:
        - Catalogos
      operationId: getCatalogoById
      summary: Obtener por idCatalogo
      parameters:
        - name: idCatalogo
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /api/productos:
    get:
      tags:
        - Productos
      operationId: getProductos
      summary: Listar productos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags:
        - Productos
      operationId: createProducto
      summary: Crear producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/productos/{id}:
    get:
      tags:
        - Productos
      operationId: getProductoById
      summary: Obtener producto por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Productos
      operationId: updateProducto
      summary: Actualizar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
    delete:
      tags:
        - Productos
      operationId: deleteProducto
      summary: Eliminar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idCatalogo:
          type: integer
          format: int64
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
        stock:
          type: integer
    ProductRequest:
      type: object
      properties:
        idCatalogo:
          type: integer
          format: int64
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
        stock:
          type: integer
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        idCatalogo:
          type: integer
          format: int64
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
        stock:
          type: integer
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
