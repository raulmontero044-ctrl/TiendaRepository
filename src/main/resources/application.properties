# Datasource
spring.datasource.url=jdbc:mariadb://localhost:3306/tienda
spring.datasource.username=tienda
spring.datasource.password=tienda
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JDBC
spring.jdbc.template.fetch-size=100
spring.jdbc.template.max-rows=1000

# Esquema de los módulos (idempotente: CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema/carrito.sql

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=es.shop
springdoc.default-produces-media-type=application/json

# Server
server.port=8080

# Session (auth)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
